<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" role="img" aria-labelledby="pt pd" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="pt">How the pipelines I work on are laid out</title>
  <desc id="pd">REST APIs, SAP, PostgreSQL and Parquet files flow into bronze, silver and gold layers, then out to analytics, data science and commercial teams. Dagster schedules it, dbt tests it, Azure DevOps ships it.</desc>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .pill { fill: #1F6F4A; }
    .pill-t { font-size: 15px; font-weight: 500; }
    .layer { stroke: #8DBBEA; stroke-width: 1.5; }
    .h { font-size: 21px; font-weight: 600; }
    .s { font-size: 14px; fill: #DCEAF9; }
    .flow { fill: none; stroke: #4C8FE0; stroke-width: 2; stroke-dasharray: 5 7; animation: march 1.4s linear infinite; }
    .ops { fill: #14532D; }
    .ops-t { font-size: 15px; }
    @keyframes march { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <!-- connectors -->
  <path class="flow" d="M200 30 C270 30 270 106 340 106"/>
  <path class="flow" d="M200 84 C270 84 270 108 340 108"/>
  <path class="flow" d="M200 138 C270 138 270 112 340 112"/>
  <path class="flow" d="M200 192 C270 192 270 114 340 114"/>
  <path class="flow" d="M530 110 H570"/>
  <path class="flow" d="M760 110 H800"/>
  <path class="flow" d="M990 110 C1010 110 1000 57 1020 57"/>
  <path class="flow" d="M990 110 H1020"/>
  <path class="flow" d="M990 110 C1010 110 1000 163 1020 163"/>

  <!-- sources -->
  <rect class="pill" x="10" y="10" width="190" height="40" rx="20"/><text class="pill-t" x="105" y="35">REST APIs</text>
  <rect class="pill" x="10" y="64" width="190" height="40" rx="20"/><text class="pill-t" x="105" y="89">SAP BW / HANA</text>
  <rect class="pill" x="10" y="118" width="190" height="40" rx="20"/><text class="pill-t" x="105" y="143">PostgreSQL</text>
  <rect class="pill" x="10" y="172" width="190" height="40" rx="20"/><text class="pill-t" x="105" y="197">Parquet files</text>

  <!-- layers -->
  <rect class="layer" x="340" y="58" width="190" height="104" rx="8" fill="#2F6BC4"/>
  <text class="h" x="435" y="106">Bronze</text><text class="s" x="435" y="131">raw, as it landed</text>
  <rect class="layer" x="570" y="58" width="190" height="104" rx="8" fill="#1F4F9C"/>
  <text class="h" x="665" y="106">Silver</text><text class="s" x="665" y="131">cleaned and checked</text>
  <rect class="layer" x="800" y="58" width="190" height="104" rx="8" fill="#12356E"/>
  <text class="h" x="895" y="106">Gold</text><text class="s" x="895" y="131">modeled for people</text>

  <!-- consumers -->
  <rect class="pill" x="1020" y="37" width="170" height="40" rx="20"/><text class="pill-t" x="1105" y="62">Analytics</text>
  <rect class="pill" x="1020" y="90" width="170" height="40" rx="20"/><text class="pill-t" x="1105" y="115">Data science</text>
  <rect class="pill" x="1020" y="143" width="170" height="40" rx="20"/><text class="pill-t" x="1105" y="168">Commercial teams</text>

  <!-- what keeps it running -->
  <path d="M340 180 V190 H990 V180" fill="none" stroke="#4C8FE0" stroke-width="1.5"/>
  <rect class="ops" x="405" y="204" width="520" height="38" rx="19"/>
  <text class="ops-t" x="665" y="228">Dagster schedules it, dbt tests it, Azure DevOps ships it</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
