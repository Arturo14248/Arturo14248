<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Arturo Demian Garcia Nepomuceno</title>
  <desc id="d">Data engineer in Monterrey, economist by training. The skyline of Cerro de la Silla is drawn as a line chart.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2247"/>
      <stop offset="1" stop-color="#1A4C8B"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="14"/></clipPath>
    <style>
      .name { font: 400 46px Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: #F3F7FC; letter-spacing: -0.4px; }
      .sub  { font: 400 21px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B9D3F0; }
      .note { font: 400 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B9D3F0; }
      .grid { stroke: #B9D3F0; stroke-opacity: .13; stroke-dasharray: 2 7; }
      .ridge { fill: none; stroke: #CFE3F8; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
               stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.6s ease-out both; }
      .pt { fill: #CFE3F8; animation: show .5s ease-out 2.2s both; }
      @keyframes draw { from { stroke-dashoffset: 1; } }
      @keyframes show { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .ridge, .pt { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <!-- chart gridlines -->
    <path class="grid" d="M0 120H1200M0 180H1200M0 240H1200"/>

    <!-- far range -->
    <path fill="#1D5560" fill-opacity=".55"
          d="M0 262 L70 240 L150 252 L235 222 L310 244 L400 214 L470 236 L560 250 L1200 270 V340 H0Z"/>

    <!-- Cerro de la Silla -->
    <path fill="#14532D"
          d="M0 300 L110 286 L210 293 L320 276 L420 285 L530 268 L640 272 L740 244 L810 212 L868 160 L900 130 L944 166 L986 180 L1034 156 L1076 138 L1110 150 L1144 144 L1200 188 V340 H0Z"/>
    <path fill="#0E3F22"
          d="M0 322 L140 306 L300 316 L470 298 L640 310 L800 286 L960 304 L1200 290 V340 H0Z"/>

    <!-- the ridge, drawn like a time series -->
    <path class="ridge" pathLength="1"
          d="M0 300 L110 286 L210 293 L320 276 L420 285 L530 268 L640 272 L740 244 L810 212 L868 160 L900 130 L944 166 L986 180 L1034 156 L1076 138 L1110 150 L1144 144 L1200 188"/>
    <g class="pt">
      <circle cx="740" cy="244" r="3.5"/><circle cx="810" cy="212" r="3.5"/><circle cx="868" cy="160" r="3.5"/><circle cx="900" cy="130" r="4.5"/><circle cx="944" cy="166" r="3.5"/><circle cx="986" cy="180" r="3.5"/><circle cx="1034" cy="156" r="3.5"/><circle cx="1076" cy="138" r="3.5"/><circle cx="1110" cy="150" r="3.5"/><circle cx="1144" cy="144" r="3.5"/>
      <path d="M900 120 V100" stroke="#CFE3F8" stroke-width="1"/>
      <text class="note" x="900" y="90" text-anchor="middle">Cerro de la Silla, 1,820 m</text>
    </g>

    <text class="name" x="56" y="100">Arturo Demian Garcia Nepomuceno</text>
    <text class="sub" x="58" y="138">Data engineer in Monterrey. Economist by training.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
