<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" width="420" height="72">
  <style>
    .t{fill:#24292f;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme:dark){.t{fill:#e6edf3}}
    .spin{transform-origin:36px 36px;animation:spin 4s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bar{fill:#1F6F78;transform-box:fill-box;transform-origin:bottom;animation:eq 1s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
    .a{animation:swap 8s infinite}
    .b{animation:swap 8s infinite -4s}
    @keyframes swap{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.b{opacity:0}}
  </style>

  <g class="spin">
    <circle cx="36" cy="36" r="28" fill="#1a1a1a"/>
    <circle cx="36" cy="36" r="24" fill="none" stroke="#3a3a3a"/>
    <circle cx="36" cy="36" r="20" fill="none" stroke="#3a3a3a"/>
    <circle cx="36" cy="36" r="16" fill="none" stroke="#3a3a3a"/>
    <path d="M36 36 L36 10 A26 26 0 0 1 54 18 Z" fill="#fff" opacity=".12"/>
    <circle cx="36" cy="36" r="10" fill="#1F6F78"/>
    <circle cx="36" cy="36" r="2" fill="#1a1a1a"/>
  </g>

  <rect class="bar" x="82"  y="26" width="4" height="24" style="animation-duration:.9s"/>
  <rect class="bar" x="88"  y="26" width="4" height="24" style="animation-duration:.6s;animation-delay:-.3s"/>
  <rect class="bar" x="94"  y="26" width="4" height="24" style="animation-duration:1.1s;animation-delay:-.5s"/>
  <rect class="bar" x="100" y="26" width="4" height="24" style="animation-duration:.7s;animation-delay:-.2s"/>
  <rect class="bar" x="106" y="26" width="4" height="24" style="animation-duration:1s;animation-delay:-.7s"/>

  <text class="t" x="126" y="30" font-size="11" letter-spacing="1" opacity=".6">ON ROTATION</text>
  <text class="t a" x="126" y="52" font-size="18" font-weight="600">The Beatles</text>
  <text class="t b" x="126" y="52" font-size="18" font-weight="600">Charli xcx</text>
</svg>
